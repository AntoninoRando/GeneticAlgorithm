# Builds the `scheduler` extension and runs the unit tests on every push and
# pull request.  The simulation data (data/) is not in the repository, so the
# tests that need data/worlds are skipped here; the others build their worlds
# in code.
#
# Two builds are checked:
#   RelWithDebInfo  the optimised build used for experiments (and by the dev
#                   container, .devcontainer/postCreate.sh)
#   Debug           the unoptimised debugger build; it must still pass the
#                   tests, and importing it must raise a RuntimeWarning
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo, Debug]
    name: build-and-test (${{ matrix.build_type }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pybind11 -r requirements.txt

      - name: Check that shell scripts are valid and use LF line endings
        run: |
          for f in run scripts/*.sh .devcontainer/*.sh; do
            bash -n "$f"
            if grep -q $'\r' "$f"; then echo "::error file=$f::CRLF line endings"; exit 1; fi
          done
          # menu.py is started as ./menu.py: it must be executable and use LF too.
          if grep -q $'\r' menu.py; then echo "::error file=menu.py::CRLF line endings"; exit 1; fi
          test -x menu.py || { echo "::error file=menu.py::not executable"; exit 1; }

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPYTHON_EXECUTABLE="$(which python)"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build --target scheduler --parallel --verbose

      - name: Check the build type reported by the module
        env:
          EXPECTED_BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          python -W ignore - <<'PY'
          import os, scheduler
          expected = os.environ["EXPECTED_BUILD_TYPE"]
          print(scheduler.__file__, scheduler.build_type, "optimized =", scheduler.optimized)
          assert scheduler.build_type == expected, scheduler.build_type
          assert scheduler.optimized == (expected != "Debug"), scheduler.optimized
          PY

      - name: An unoptimised module warns on import
        if: matrix.build_type == 'Debug'
        run: |
          if python -W error::RuntimeWarning -c "import scheduler" 2>warning.txt; then
            echo "::error::importing a Debug build raised no RuntimeWarning"; exit 1
          fi
          grep -q "WITHOUT optimisation" warning.txt

      - name: An optimised module imports without warnings
        if: matrix.build_type != 'Debug'
        run: python -W error -c "import scheduler"

      - name: Unit tests
        run: python -W ignore::RuntimeWarning -m unittest discover -s tests -v
