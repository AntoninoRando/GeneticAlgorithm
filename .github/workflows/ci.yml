# Builds the `scheduler` extension and runs the unit tests on every push and
# pull request.  The simulation data (data/) is not in the repository, so the
# tests that need data/worlds are skipped here; the others build their worlds
# in code.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pybind11 -r requirements.txt

      - name: Check that shell scripts are valid and use LF line endings
        run: |
          for f in run scripts/*.sh .devcontainer/*.sh; do
            bash -n "$f"
            if grep -q $'\r' "$f"; then echo "::error file=$f::CRLF line endings"; exit 1; fi
          done

      - name: Configure
        # Same configuration as the dev container (.devcontainer/postCreate.sh).
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DPYTHON_EXECUTABLE="$(which python)"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build --target scheduler --parallel

      - name: Import check
        run: python -c "import scheduler; print(scheduler.__file__)"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
